name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate listings
        run: |
          extra=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.pull_request.head.repo.fork }}" != "true" ]; then
            extra="--allow-verified"
          fi
          python scripts/validate.py $extra
